preprocessing:
  remove_headings: true
  lowercase: true
  normalize_wikitext: true
  unicode_normalize: true
  normalize_numbers: true

tokenizer:
  min_frequency: 3
  oov_token: "<UNK>"

sequences:
  sequence_length: 50

evaluate:
  batch_size: 128

model:
  embedding_dim: 256
  lstm_units: 512
  dropout_rate: 0.3

train:
  batch_size: 128
  epochs: 30
  learning_rate: 0.0001
  precision_policy: "float32"
  patience: 6
  reduce_lr_patience: 2
  clipnorm: 1.0